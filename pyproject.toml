[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oilshock"
version = "0.1.0"
description = "How an oil price shock moves India's economy, and where forecasting models break"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2.2",
    "pyarrow",
    "scipy",
    "statsmodels",
    "pyyaml",
    "xgboost",
    "plotly",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/pages/*" = ["E402"]
"app/Home.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app", "tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning", "ignore::UserWarning"]
markers = ["slow: builds the full synthetic demo (needs all dependencies)"]
